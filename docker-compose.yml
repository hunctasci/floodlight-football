# Local parity + single-VPS production topology.
# Docker is for local parity / integration / self-hosting only — it is NOT
# the Cloudflare Workers production path (see docs/deployment.md).
# Production: set POSTGRES_PASSWORD and CLIENT_ORIGIN in .env (see .env.example).
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 8080
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://retro:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/retro
      ROOM_TTL_SEC: 7200
      LOG_LEVEL: info
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-*}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    expose:
      - 8080
    # Published for the vite dev page (http://127.0.0.1:5173), which has no
    # backend on its own origin. The Caddy-served game uses same-origin.
    ports:
      - 127.0.0.1:8080:8080

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    expose:
      - 6379

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retro
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro -d retro"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    expose:
      - 5432

  caddy:
    image: caddy:2-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      # Production game build (run `npm run build --workspace=floodlight-football` first).
      - ./apps/game/dist:/srv/game:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
