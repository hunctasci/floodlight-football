name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build --workspaces --if-present

  server-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@floodlight/protocol
      - run: REDIS_URL=redis://localhost:6379 npm run test --workspace=@floodlight/server

  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf:check --workspace=floodlight-football
      - run: npm run build --workspace=floodlight-football
      # No Cloudflare credentials needed: typecheck + bundle only.
      # Production deploys are manual (`npm run deploy`) or a separate
      # explicitly authenticated workflow — never per-PR.

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/game
      # Local Cloudflare runtime (vite plugin Worker + DO) is booted by the
      # Playwright webServer; real Chromium WebRTC proves the friend-match flow.
      - run: npm run test:e2e --workspace=floodlight-football

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t retro-server:ci .
